events {}

http {
    upstream creation_service {
        server host.docker.internal:8000;
    }
    upstream redirect_service{
        server host.docker.internal:8001;
    }
    server {
        listen 80;

        location = /links {
            proxy_pass http://creation_service;
        }
        location / {
            proxy_pass http://redirect_service;
        }
    }
}