events {}

http {
    # Docker DNS follows service containers when their IP addresses change.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream creation_service {
        zone creation_service 64k;
        server creation-1:8000 resolve;
        server creation-2:8002 resolve;
    }

    upstream redirect_service {
        zone redirect_service 64k;
        server redirect-1:8001 resolve;
        server redirect-2:8003 resolve;
    }

    server {
        listen 80;

        location = /links {
            proxy_pass http://creation_service;
        }

        location / {
            proxy_pass http://redirect_service;
        }
    }
}
